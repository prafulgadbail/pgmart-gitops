# CI pipeline for order-service
# Pull requests: stages 1-7. Push to main: stages 1-9.
# Any failed stage stops the pipeline. Argo CD deploys the new image tag (CD, not in this file).

name: order-service

# ---------- When it runs: pull requests and pushes to main that change this service ----------
on:
  pull_request:
    branches: [main]
    paths: [services/order-service/**, .github/workflows/order-service.yml]
  push:
    branches: [main]
    paths: [services/order-service/**, .github/workflows/order-service.yml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read        # read the code
  pull-requests: read   # Gitleaks reads the commits of a pull request
  id-token: write       # OIDC login to AWS, no access keys stored in GitHub

# ---------- Environment ----------
env:
  SERVICE: order-service
  SERVICE_DIR: services/order-service
  IMAGE: pgmart/order-service:${{ github.sha }}
  ECR_REPOSITORY: pgmart-gitops/order-service
  SONAR_PROJECT: ${{ vars.SONAR_ORGANIZATION }}_pgmart-gitops_order-service

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      # ---------- Setup: code and Java ----------
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for Gitleaks and SonarQube

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ---------- 1. Secret scan ----------
      - name: 1. Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      # ---------- 2. Build and unit test (JaCoCo writes the coverage report) ----------
      - name: 2. Build and unit test (Maven)
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn -B verify

      # ---------- 3. Dependency scan: libraries in pom.xml ----------
      - name: 3. Dependency scan (Trivy fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---------- 4. SonarQube analysis ----------
      - name: 4. SonarQube analysis
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ env.SONAR_PROJECT }}

      # ---------- 5. Quality Gate ----------
      - name: 5. Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        with:
          scanMetadataReportFile: ${{ env.SERVICE_DIR }}/target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ---------- 6. Docker build ----------
      - name: 6. Docker build
        run: docker build -t "$IMAGE" "$SERVICE_DIR"

      # ---------- 7. Image scan: OS packages and the app's libraries ----------
      - name: 7. Image scan (Trivy image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---------- 8. Push to ECR (main only) ----------
      - name: Log in to AWS
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: 8. Push to ECR
        if: github.ref == 'refs/heads/main'
        env:
          TARGET: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker tag "$IMAGE" "$TARGET"
          docker push "$TARGET"

      # ---------- 9. Update the image tag in the config repository (main only) ----------
      - name: Token for the config repository (GitHub App)
        if: github.ref == 'refs/heads/main'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: pgmart-gitops-config

      - name: Checkout the config repository
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/pgmart-gitops-config
          token: ${{ steps.app-token.outputs.token }}
          path: config

      - name: 9. Update image tag
        if: github.ref == 'refs/heads/main'
        working-directory: config
        run: |
          yq -i ".image.tag = \"$GITHUB_SHA\"" "helm/values/$SERVICE.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy($SERVICE): image ${GITHUB_SHA::7}"
          git push

      # ---------- Test and coverage reports to download (kept even when a stage fails) ----------
      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: order-service-reports
          path: |
            ${{ env.SERVICE_DIR }}/target/surefire-reports/
            ${{ env.SERVICE_DIR }}/target/site/jacoco/
          retention-days: 30
