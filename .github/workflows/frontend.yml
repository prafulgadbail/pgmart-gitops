# CI for the frontend (DevOps page, store and admin).
# Stages, one job each: secret scan → build and unit test → dependency scan → SonarQube analysis → Quality Gate
# No container: on AWS the built files go to S3 + CloudFront (added once AWS exists).

name: frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  build-test:
    name: Build and unit test (npm)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit test with coverage (Vitest)
        run: npm run test:coverage
      - run: npm run build
      - name: Keep the coverage report for SonarQube Cloud
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1
      - name: Keep the built site
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  dependency-scan:
    name: Dependency scan (Trivy fs)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Known vulnerabilities in the npm dependencies (package-lock.json)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  sonarqube-analysis:
    name: SonarQube analysis
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube Cloud uses the history to find new code
      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Send the code, tests and coverage to SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_ORGANIZATION }}_pgmart-gitops_frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      - name: Keep the analysis id for the Quality Gate
        uses: actions/upload-artifact@v7
        with:
          name: frontend-sonar-report
          path: frontend/.scannerwork/report-task.txt
          include-hidden-files: true # .scannerwork is a hidden folder
          retention-days: 1

  quality-gate:
    name: Quality Gate
    needs: sonarqube-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: frontend-sonar-report
      - name: Wait for the SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        with:
          scanMetadataReportFile: report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
