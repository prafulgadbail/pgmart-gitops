# CI for the frontend (DevOps page, store and admin).
# Stages: secret scan → type check, unit test, SonarQube Cloud and build → dependency scan.
# No container: on AWS the built files go to S3 + CloudFront (added once AWS exists).

name: frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  build-test:
    name: Type check, unit test, SonarQube Cloud and build
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube Cloud uses the history to find new code
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit test with coverage
        run: npm run test:coverage
      - name: SonarQube Cloud analysis and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        # Report only for now: the Quality Gate needs 80% test coverage on new code.
        # Remove this line once the unit tests are there, so a failed gate stops the pipeline.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_ORGANIZATION }}_pgmart-gitops_frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  dependency-scan:
    name: Dependency scan (Trivy fs)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
