# CI for one Spring Boot service. Called by user-service.yml, catalog-service.yml and order-service.yml.
# Stages, one job each:
#   secret scan → build and unit test → dependency scan → SonarQube analysis → Quality Gate
#                                                                         └→ Docker build → image scan
# Nothing is pushed yet: ECR push and the GitOps image tag update are added once AWS exists.

name: reusable-java-service

on:
  workflow_call:
    inputs:
      service:
        description: Folder under services/, e.g. user-service
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

env:
  SERVICE_DIR: services/${{ inputs.service }}
  IMAGE: pgmart/${{ inputs.service }}:${{ github.sha }}

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so every new commit is scanned
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  build-test:
    name: Build and unit test (Maven)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ env.SERVICE_DIR }}/pom.xml
      - name: mvn verify (compile, unit tests, JaCoCo coverage)
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn -B verify
      - name: Keep the compiled code and test reports for SonarQube Cloud
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-build
          path: |
            ${{ env.SERVICE_DIR }}/target/classes
            ${{ env.SERVICE_DIR }}/target/test-classes
            ${{ env.SERVICE_DIR }}/target/surefire-reports
            ${{ env.SERVICE_DIR }}/target/site/jacoco
          retention-days: 1

  dependency-scan:
    name: Dependency scan (Trivy fs)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Known vulnerabilities in the Maven dependencies (pom.xml)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  sonarqube-analysis:
    name: SonarQube analysis
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube Cloud uses the history to find new code
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ env.SERVICE_DIR }}/pom.xml
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.service }}-build
          path: ${{ env.SERVICE_DIR }}/target
      - name: Send the code, tests and coverage to SonarQube Cloud
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_ORGANIZATION }}_pgmart-gitops_${{ inputs.service }}
      - name: Keep the analysis id for the Quality Gate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-sonar-report
          path: ${{ env.SERVICE_DIR }}/target/sonar/report-task.txt
          retention-days: 1

  quality-gate:
    name: Quality Gate
    needs: sonarqube-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.service }}-sonar-report
      - name: Wait for the SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        with:
          scanMetadataReportFile: report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: Docker build
    # Not blocked by the Quality Gate yet: the gate needs 80% test coverage on new code.
    # Once the unit tests are there, change this to: needs: quality-gate
    needs: sonarqube-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.SERVICE_DIR }}
          tags: ${{ env.IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar # saved as a file for the scan; not pushed yet
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
      - name: Keep the image for the scan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  image-scan:
    name: Image scan (Trivy image)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.service }}-image
          path: ${{ runner.temp }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
