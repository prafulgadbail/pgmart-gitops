# CI for one Spring Boot service. Called by user-service.yml, catalog-service.yml and order-service.yml.
# Stages run one after another; a failed stage stops everything after it:
#   secret scan → build and unit test → dependency scan → SonarQube analysis → Quality Gate
#   → Docker build → image scan
# Every scan writes a report to the run's Summary page and keeps it as a downloadable artifact.
# Nothing is pushed yet: ECR push and the GitOps image tag update are added once AWS exists.

name: reusable-java-service

on:
  workflow_call:
    inputs:
      service:
        description: Folder under services/, e.g. user-service
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

env:
  SERVICE_DIR: services/${{ inputs.service }}
  IMAGE: pgmart/${{ inputs.service }}:${{ github.sha }}

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so every new commit is scanned
      # Writes its findings to the Summary page and keeps gitleaks-results.sarif as an artifact
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  build-test:
    name: Build and unit test (Maven)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ env.SERVICE_DIR }}/pom.xml
      - name: mvn verify (compile, unit tests, JaCoCo coverage)
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn -B verify
      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-test-reports
          path: |
            ${{ env.SERVICE_DIR }}/target/surefire-reports
            ${{ env.SERVICE_DIR }}/target/site/jacoco
          retention-days: 30
      - name: Hand over the compiled code to SonarQube analysis
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-build
          path: |
            ${{ env.SERVICE_DIR }}/target/classes
            ${{ env.SERVICE_DIR }}/target/test-classes
            ${{ env.SERVICE_DIR }}/target/surefire-reports
            ${{ env.SERVICE_DIR }}/target/site/jacoco
          retention-days: 1

  dependency-scan:
    name: Dependency scan (Trivy fs)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Known vulnerabilities in the Maven dependencies (pom.xml)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-dependency-scan.txt
      - name: Report on the Summary page
        if: always()
        run: |
          {
            echo "### Dependency scan (Trivy fs): ${{ inputs.service }}"
            echo "<pre>"
            cat trivy-dependency-scan.txt
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dependency scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-dependency-scan
          path: trivy-dependency-scan.txt
          retention-days: 30

  sonarqube-analysis:
    name: SonarQube analysis
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube Cloud uses the history to find new code
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ env.SERVICE_DIR }}/pom.xml
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.service }}-build
          path: ${{ env.SERVICE_DIR }}/target
      - name: Send the code, tests and coverage to SonarQube Cloud
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_ORGANIZATION }}_pgmart-gitops_${{ inputs.service }}
      - name: Hand over the analysis id to the Quality Gate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-sonar-task
          path: ${{ env.SERVICE_DIR }}/target/sonar/report-task.txt
          retention-days: 1

  quality-gate:
    name: Quality Gate
    needs: sonarqube-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.service }}-sonar-task
      - name: Wait for the SonarQube Cloud Quality Gate
        id: gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        with:
          scanMetadataReportFile: report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Report on the Summary page
        if: always()
        run: |
          {
            echo "### Quality Gate (SonarQube Cloud): ${{ steps.gate.outputs.quality-gate-status }}"
            echo "Full report: $(grep '^dashboardUrl=' report-task.txt | cut -d= -f2-)"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker build
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.SERVICE_DIR }}
          tags: ${{ env.IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar # saved as a file for the scan; not pushed yet
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
      - name: Hand over the image to the image scan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  image-scan:
    name: Image scan (Trivy image)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.service }}-image
          path: ${{ runner.temp }}
      - name: Known vulnerabilities in the image (OS packages and the app's libraries)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-image-scan.txt
      - name: Report on the Summary page
        if: always()
        run: |
          {
            echo "### Image scan (Trivy image): ${{ inputs.service }}"
            echo "<pre>"
            cat trivy-image-scan.txt
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Image scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-image-scan
          path: trivy-image-scan.txt
          retention-days: 30
